<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Body Clock</title>
<meta name="description" content="Plans your sleep around long-haul trips: nap now or later, crew rest alarms and alertness at landing.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Body Clock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --sec:#5F5F66; --ter:#8A8A90; --sep:rgba(60,60,67,.18);
  --fill:rgba(118,118,128,.12); --bar:rgba(249,249,249,.94); --tint:#0A66D8; --sleep:#5856D6; --sleepbg:rgba(88,86,214,.14);
  --flight:#1C1C1E; --day:#F7DC94; --nite:#2E3160; --nitebg:rgba(46,49,96,.10); --out:#C2378A; --outbg:rgba(194,55,138,.12);
  --switch:#248A3D; --danger:#C4161C; --dusk:#E6A766; --sunc:#C98A00; --bodyn:#3459C9;
  --scale:linear-gradient(90deg,#C4161C 0%,#E2531A 17%,#EE8A12 33%,#D8B10F 50%,#7DB843 67%,#2E9E5B 83%,#1F7A4D 100%);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --sec:#A1A1A8; --ter:#7C7C82; --sep:rgba(84,84,88,.6);
    --fill:rgba(118,118,128,.24); --bar:rgba(22,22,24,.94); --tint:#3E9BFF; --sleep:#8D8BFF; --sleepbg:rgba(94,92,230,.28);
    --flight:#E5E5EA; --day:#8A7440; --nite:#262A55; --nitebg:rgba(120,130,255,.12); --out:#F06BB8; --outbg:rgba(240,107,184,.18);
    --switch:#30D158; --danger:#FF6961; --dusk:#9A6A44; --sunc:#F5C451; --bodyn:#7C9BFF;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.3}
a{color:var(--tint);text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 100px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--bar);border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tabbar-in{display:flex;justify-content:space-around;width:100%;max-width:560px;padding-top:7px;height:56px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;min-height:44px;border:0;background:none;color:var(--sec);font-size:10px;font-weight:600;cursor:pointer}
.tab[aria-current=page]{color:var(--tint)}
.tab svg{width:26px;height:26px}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin:-6px -8px 0}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px;border:0;background:none;color:var(--tint);font-size:17px;cursor:pointer}
.navbtn{min-height:44px;padding:0 8px;border:0;background:none;color:var(--tint);font-size:17px;cursor:pointer}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--sec)}
h1{margin:2px 0 0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em}
.sub{margin-top:2px;font-size:15px;color:var(--sec)}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 4px 6px}
.plus{width:44px;height:44px;border-radius:50%;background:var(--fill);border:0;display:flex;align-items:center;justify-content:center;color:var(--tint);cursor:pointer;flex:none}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:22px;padding:18px 20px 16px}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:52px;width:100%;border:0;background:none;text-align:left;color:var(--label);cursor:pointer;font-size:17px}
.row+.row,.row+.subrow+.row{border-top:1px solid var(--sep)}
.row.static{cursor:default}
.row .main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row .t1{font-size:17px}
.row .t1.b{font-weight:600}
.row .t2{font-size:15px;color:var(--sec);font-variant-numeric:tabular-nums}
.row .t3{font-size:13px;color:var(--sec)}
.row .val{font-size:17px;color:var(--sec);text-align:right}
.subrow{display:flex;align-items:center;gap:10px;padding:0 16px 12px;font-size:15px;color:var(--sec);border:0;background:none;width:100%;text-align:left;cursor:pointer;min-height:32px}
.subrow.link{color:var(--tint)}
.chev{width:18px;height:18px;flex:none;color:var(--ter)}
.grp-h{margin:18px 16px 6px;font-size:13px;color:var(--sec);text-transform:uppercase}
.grp-h.day{margin:18px 4px 6px;font-weight:600;letter-spacing:.02em}
.foot{margin:6px 16px 0;font-size:13px;line-height:18px;color:var(--sec)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--fill);color:var(--sec);font-size:13px;font-weight:600;white-space:nowrap;border:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.word{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;white-space:nowrap}
.hero-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hero-l{display:flex;align-items:center;gap:6px;color:var(--sleep);font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.hero-l.fl{color:var(--sec)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.big{font-size:44px;line-height:50px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lab{font-size:15px;color:var(--sec)}
.why{margin:12px 0 0;font-size:15px;line-height:20px;color:var(--sec)}
.tcol{width:80px;flex:none;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:14px;border:0;background:var(--tint);color:#fff;font-size:17px;font-weight:600;width:100%;cursor:pointer}
.btn.sec{background:var(--fill);color:var(--tint)}
.btn.small{min-height:40px;width:auto;padding:0 16px;font-size:15px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{min-height:32px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:600;cursor:pointer}
.tl{background:var(--card);border-radius:16px;padding:4px 16px 4px 8px}
.tlr{display:flex;align-items:stretch;gap:10px;min-height:58px}
.rail{position:relative;width:30px;flex:none}
.rail i{position:absolute;left:12px;width:6px;top:0;bottom:0}
.tlr:first-child .rail i{top:14px;border-radius:3px 3px 0 0}
.tlr:last-child .rail i{bottom:14px;border-radius:0 0 3px 3px}
.node{position:absolute;left:15px;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:0 0 0 2px var(--card);border:2px solid var(--sep);color:var(--sec)}
.node.now{width:16px;height:16px;background:var(--tint);border-color:var(--card)}
.tlc{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--sep)}
.tlr:last-child .tlc{border-bottom:0}
.tlc .main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tlc .t1{font-size:17px}
.tlc .t3{font-size:13px;color:var(--sec)}
.tlc .rt{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
.chip[aria-pressed=true]{background:var(--tint);color:#fff}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.dialrow{display:flex;align-items:center;gap:14px}
.dialrow .dial{flex:none;width:124px;height:124px}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sw{position:relative;width:51px;height:31px;border:0;border-radius:16px;background:var(--fill);cursor:pointer;padding:0;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.sw[aria-checked=true]{background:var(--switch)}
.sw[aria-checked=true]::after{left:22px}
.pill{padding:6px 10px;border-radius:8px;background:var(--fill);font-size:17px;font-variant-numeric:tabular-nums;border:0;color:var(--label)}
input.pill,select.pill{-webkit-appearance:none;appearance:none;font:inherit;font-size:17px}
input[type=time].pill,input[type=datetime-local].pill{min-height:36px}
select.pill{padding-right:10px;max-width:60vw}
.opt{display:flex;flex-direction:column;gap:10px;width:100%;padding:14px 16px;border-radius:16px;background:var(--card);border:2px solid transparent;text-align:left;cursor:pointer}
.opt[aria-pressed=true]{border-color:var(--tint)}
.radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ter);display:flex;align-items:center;justify-content:center}
.opt[aria-pressed=true] .radio{border-color:var(--tint)}
.opt[aria-pressed=true] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--tint)}
.badge{padding:2px 7px;border-radius:6px;background:var(--sleepbg);color:var(--sleep);font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.meter{position:relative;height:6px;border-radius:3px;background:var(--scale)}
.meter i{position:absolute;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--card);border:3px solid var(--label)}
.rib{position:relative;height:66px}
.rib .ns{position:absolute;left:0;right:0;top:0;height:6px;border-radius:3px;background:var(--day);overflow:hidden}
.rib .ns i{position:absolute;top:0;bottom:0;background:var(--nite)}
.rib .al{position:absolute;left:0;right:0;top:10px;height:18px;border-radius:9px;overflow:hidden}
.rib .al i{position:absolute;top:0;bottom:0;background:var(--sleep)}
.rib .tk{position:absolute;top:0;height:32px;width:1px;background:var(--sep)}
.rib .tk.mid{width:2px;background:var(--label);opacity:.5}
.rib .ev{position:absolute;top:32px;height:4px;border-radius:2px}
.rib .now{position:absolute;top:-2px;width:3px;height:34px;border-radius:2px;background:var(--tint)}
.rib .lb{position:absolute;top:42px;font-size:12px;color:var(--sec);transform:translateX(-50%);white-space:nowrap}
.rib .lb.d{font-weight:600;color:var(--label)}
.rib .lb.n{font-weight:600;color:var(--tint)}
.legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--sec)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw10{width:10px;height:10px;border-radius:3px;display:inline-block}
.stepper{display:flex;border-radius:8px;background:var(--fill);overflow:hidden;flex:none}
.stepper button{width:46px;height:34px;border:0;background:none;font-size:20px;cursor:pointer}
.stepper span{width:1px;background:var(--sep);margin:6px 0}
.watch{background:var(--sleep);color:#fff;border-radius:22px;padding:18px 20px}
.watch .lab{color:rgba(255,255,255,.85)}
.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.code{display:flex;flex-direction:column;gap:2px;background:var(--card);border-radius:16px;padding:12px 14px}
.code input{width:100%;border:0;background:none;padding:0;font:inherit;font-size:34px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--label);outline:none}
.code .t3{font-size:13px;color:var(--sec);min-height:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--fill);font-size:15px;font-weight:600;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--tint);color:#fff}
.err{margin:8px 16px 0;font-size:15px;color:var(--danger)}
.msg{margin:8px 16px 0;font-size:15px;color:var(--sec)}
.empty{text-align:center;padding:28px 20px}
.empty p{color:var(--sec);margin:8px 0 18px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top) - 10px);border-radius:14px 14px 0 0;overflow:auto;padding:0 16px calc(env(safe-area-inset-bottom) + 24px)}
.grab{display:flex;justify-content:center;padding-top:6px}
.grab span{width:36px;height:5px;border-radius:3px;background:var(--ter);opacity:.5}
.sheet-h{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;height:48px;margin:0 -8px}
.sheet-h .ttl{justify-self:center;font-weight:600}
.sheet-h .r{justify-self:end;font-weight:600}
figure{margin:0}
.chart{background:var(--card);border-radius:16px;padding:14px 0 10px;overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:inherit}
details.how{background:var(--card);border-radius:16px;padding:12px 16px}
details.how summary{cursor:pointer;font-size:17px}
details.how p{font-size:15px;line-height:21px;color:var(--sec)}
.nowline{display:flex;align-items:center;gap:8px;margin:16px 4px 4px;color:var(--tint);font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.nowline::after{content:"";flex:1;height:2px;border-radius:1px;background:var(--tint)}
.past{opacity:.6}
.tag{font-size:12px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.03em}
.ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.rm{flex:none;width:24px;height:24px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:18px;line-height:24px;padding:0;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<nav class="tabbar" aria-label="Tabs"><div class="tabbar-in">
  <button class="tab" type="button" data-go="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now</button>
  <button class="tab" type="button" data-go="trip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>Trip</button>
  <button class="tab" type="button" data-go="calc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18h18M5 18v-5a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v5M7 10V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/><path d="M12 13v2M9 14h6" opacity="0"/></svg>Calculator</button>
  <button class="tab" type="button" data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Settings</button>
</div></nav>
<div id="sheet"></div>
<input type="file" id="impFile" accept=".json,application/json" hidden>

<script src="airports.js"></script>
<script src="engine.js"></script>
<script>
(function(){
'use strict';
var BUILD = '21 Oct 2026 · build 22';
var KEY = 'bodyclock2', CLASSIC_KEY = 'body-clock-overlay-v3', H = BC.H;

/* ---------- state ---------- */
function defaults(){
  return {v:1, home:'ATL', bed:'23:00', wake:'07:00', landBed:2, van:2, ready:0.75, balance:'balanced', light:50,
          night:{auto:true, start:'19:00', end:'23:00', gap:12, last:12},
          dests:DEFAULT_DESTS.slice(), flights:[], lay:{}, actual:[], skips:[]};
}
function load(){
  try{
    var o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(o && o.v === 1 && Array.isArray(o.flights)) return fix(o);
  }catch(e){}
  return defaults();
}
function fix(o){
  var d = defaults();
  Object.keys(d).forEach(function(k){ if(o[k] === undefined) o[k] = d[k]; });
  Object.keys(d.night).forEach(function(k){ if(o.night[k] === undefined) o.night[k] = d.night[k]; });
  if(!Array.isArray(o.dests)) o.dests = d.dests;
  if(!o.lay || typeof o.lay !== 'object') o.lay = {};
  if(!Array.isArray(o.actual)) o.actual = [];
  if(!Array.isArray(o.skips)) o.skips = [];
  return o;
}
var S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function nextId(){ var m = 0; S.flights.forEach(function(f){ if(f.id > m) m = f.id; }); return m + 1; }

/* ---------- helpers ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var I = {
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  moon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  plane:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>',
  timer:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 2h6"/></svg>',
  sun:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  car:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14v-4l-2-5H7l-2 5v4zM5 13h14"/><circle cx="8" cy="17.5" r="1.5"/><circle cx="16" cy="17.5" r="1.5"/></svg>',
  land:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M4.5 9.5l2-1 3 2.5 3-1-3.5-6 2-.8 6 5.3 3.4-1.1a1.6 1.6 0 0 1 1 3l-14 4.3-3.2-3.3z"/></svg>',
  glass:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-1 8a3 3 0 0 1-6 0L8 3zM12 14v6M8 21h8"/></svg>',

};
function wordHTML(a, withNum){

}
function durTxt(ms){ var m = Math.round(ms/60000), h = Math.floor(m/60), r = m % 60; return h ? h + ' h' + (r ? ' ' + BC.pad(r) + ' min' : '') : r + ' min'; }

function now(){ return Date.now(); }

/* ---------- plan (cached in the engine) ---------- */
function P(){ return BC.plan(S, now()); }

/* ---------- ribbon ---------- */
function ribbon(Pl, a, b, tz, opts){
  opts = opts || {};

  var h = '<div class="rib">';
  /* day and night */
  h += '<div class="ns">';
  var run = null;
  R.pts.forEach(function(p){
    if(p.t < a || p.t > b) return;
    if(p.ni && run === null) run = p.t;
    if(!p.ni && run !== null){ h += '<i style="left:' + pc(run) + ';width:' + ((p.t - run)/span*100).toFixed(2) + '%"></i>'; run = null; }
  });
  if(run !== null) h += '<i style="left:' + pc(run) + ';right:0"></i>';
  h += '</div>';
  /* alertness, colour carried through sleep so the sleep overlay has clean edges */
  var stops = [], last = null, n = 72;
  for(var i=0;i<=n;i++){
    var t = a + span*i/n, p = BC.ptAt(R, t);
    if(!p.sl || last === null) last = p.A;
    if(p.t > R.t1) break;
    stops.push(BC.color(last) + ' ' + (i/n*100).toFixed(1) + '%');
  }
  h += '<div class="al" style="background:linear-gradient(90deg,' + stops.join(',') + ')">';
  Pl.sleeps.forEach(function(s){
    if(s.b <= a || s.a >= b) return;
    var x0 = Math.max(s.a, a), x1 = Math.min(s.b, b);
    h += '<i style="left:' + pc(x0) + ';width:' + ((x1 - x0)/span*100).toFixed(2) + '%"></i>';
  });
  h += '</div>';
  /* ticks on the clock given */
  var stepH = span <= 60*H ? 6 : span <= 120*H ? 12 : 24, labels = [];
  var t0 = BC.localToMs(tz, BC.dateStr(tz, a) + 'T00:00');
  for(var k=0; k<200; k++){
    var tt = t0 + k*stepH*H;
    var hr = +BC.hm(tz, tt).slice(0,2);
    if(tt > b) break;
    if(tt < a + span*0.02 || tt > b - span*(opts.endLabel ? 0.1 : 0.04)) continue;
    var mid = hr === 0;
    h += '<i class="tk' + (mid ? ' mid' : '') + '" style="left:' + pc(tt) + '"></i>';
    labels.push({t:tt, txt:mid ? BC.dow(tz, tt) : BC.hm(tz, tt), d:mid});
  }
  /* night outs and flights */
  Pl.layovers.forEach(function(L){
    if(!L.out || L.out.ne <= a || L.out.ns >= b) return;
    var x0 = Math.max(L.out.ns, a), x1 = Math.min(L.out.ne, b);
    h += '<i class="ev" style="left:' + pc(x0) + ';width:' + ((x1 - x0)/span*100).toFixed(2) + '%;background:var(--out)"></i>';
  });
  Pl.flights.forEach(function(f){
    if(f.b <= a || f.a >= b) return;
    var x0 = Math.max(f.a, a), x1 = Math.min(f.b, b);
    h += '<i class="ev" style="left:' + pc(x0) + ';width:' + ((x1 - x0)/span*100).toFixed(2) + '%;background:var(--flight)"></i>';
  });
  var nw = now(), hasNow = nw >= a && nw <= b;
  if(hasNow) h += '<i class="now" style="left:' + pc(nw) + '"></i>';
  var nowX = hasNow ? (nw - a)/span : -1;
  if(hasNow) h += '<span class="lb n" style="left:' + pc(nw) + ';' + (nowX < 0.05 ? 'transform:none' : '') + '">Now</span>';
  labels.forEach(function(l){
    var x = (l.t - a)/span;
    if(hasNow && Math.abs(x - nowX) < 0.08) return;
    h += '<span class="lb' + (l.d ? ' d' : '') + '" style="left:' + pc(l.t) + '">' + esc(l.txt) + '</span>';
  });
  if(opts.endLabel) h += '<span class="lb" style="left:auto;right:0;transform:none">' + esc(opts.endLabel) + '</span>';
  h += '</div>';
  h += '<div class="legend"><span>Very tired<span style="width:46px;height:8px;border-radius:4px;background:var(--scale);display:inline-block"></span>Sharp</span>' +
       '<span><span class="sw10" style="background:var(--sleep)"></span>Sleep</span><span><span class="sw10" style="background:var(--nite)"></span>Night</span>' +
       (opts.out ? '<span><span class="sw10" style="background:var(--out)"></span>Night out</span>' : '') + '</div>';
  return h;
}

/* ---------- events in time order ---------- */
function events(Pl, from, max){
  var ev = [];
  Pl.sleeps.forEach(function(s){
    if(s.kind === 'rest' || s.a < from || s.actual || s.open) return;
    var L = layOfBlock(Pl, s), tz = L ? L.ap.tz : Pl.E.home.tz;
    ev.push({t:s.a, tz:tz, title:s.kind === 'home' ? 'Sleep at home' : s.kind === 'nap' ? 'Nap' : 'Sleep', sub:'Wake ' + whenTxt(tz, s.b, s.a), color:'var(--sleep)', go:L ? 'lay/' + L.id : null});
  });
  Pl.layovers.forEach(function(L){
    if(!L.out || L.out.ns < from) return;
    ev.push({t:L.out.ns, tz:L.ap.tz, title:'Crew night out', sub:'Back by ' + BC.hm(L.ap.tz, L.out.ne) + ' · last drink by ' + BC.dow(L.ap.tz, L.out.lastDrink) + ' ' + BC.hm(L.ap.tz, L.out.lastDrink), color:'var(--out)', go:'lay/' + L.id});
  });
  Pl.flights.forEach(function(f){
    var L = Pl.layovers.filter(function(x){ return x.outF.id === f.id; })[0];
    var t = L ? L.duty : f.a;
    if(f.b < from || t < from - 0) { if(!(f.a >= from)) return; }
    var title = (L ? 'Van · ' : '') + f.f.code + ' → ' + f.t.code + (L ? ' ' + BC.hm(f.f.tz, f.a) : '');
    ev.push({t:L ? L.duty : f.a, tz:f.f.tz, title:title, sub:'Lands ' + whenTxt(f.t.tz, f.b, f.a) + ' ' + f.t.city + ' time', flight:f, go:'flight/' + f.id});
  });
  ev.sort(function(p,q){ return p.t - q.t; });
  return ev.slice(0, max);
}
function eventRow(e, ref){
  var chip = e.flight && e.flight.role === 'operate' ? '<span class="word" aria-label="Alertness at landing ' + BC.word(e.flight.landA) + ', ' + Math.round(e.flight.landA) + '"><span class="dot" style="background:' + BC.color(e.flight.landA) + '"></span>' + BC.word(e.flight.landA) + '</span>'

/* the earliest planned sleep that is over but not yet confirmed */
function pendingBlock(Pl){
  var nw = now();
  return Pl.sleeps.filter(function(s){
    if(!s.lay || s.actual || s.open || s.b > nw) return false;
    var L = layById(Pl, s.lay);
    return L && s.a >= L.T - 1000;
  })[0] || null;
}

/* ---------- why text for a planned block ---------- */
function whyFor(Pl, s){
  var L = layOfBlock(Pl, s);
  if(s.kind === 'home') return 'Back on your usual night at home.';
  if(!L) return '';
  var opt = L.picked, isArr = s.kind === 'nap' && s.a <= L.ws + 1000, isLate = s.kind === 'nap' && !isArr;
  if(isArr && opt === 'both') return 'Short on purpose: enough for ' + (L.out ? 'tonight' : 'the evening') + ', and you will still be sleepy enough to nap again before the van.';
  if(isArr) return 'A proper nap now keeps you going ' + (L.out ? 'through the night out.' : 'until bedtime.');
  if(isLate) return 'Last sleep before the van. Lie down even if sleep is slow to come.';
  if(s.mid) return 'Your usual night here, on the clock your layover balance setting picks.';
  if(s.kind === 'main' && L.out) return 'Straight to bed after the night out.';
  return 'Your main sleep for this layover.';
}

/* ---------- body clock ---------- */
function gapTxt(g){
  var a = Math.abs(g), m = Math.round(a*60/10)*10, h = Math.floor(m/60), r = m % 60;
  return (h ? h + ' h' : '') + (h && r ? ' ' : '') + (r || !h ? r + ' min' : '');
}
function gapPhrase(g, city){

  return gapTxt(g) + (g > 0 ? ' behind ' : ' ahead of ') + city;
}
function hh(x){ x = ((x % 24) + 24) % 24; var m = Math.round(x*60) % 1440; return BC.pad(Math.floor(m/60)) + ':' + BC.pad(m % 60); }
function hhmmH(s){ var p = String(s).split(':'); return (+p[0] || 0) + (+p[1] || 0)/60; }
/* 24-hour dial on the local clock: the body's night now (outer ring) and on the days before (inner rings, fading),
   against your usual night here (dashed). */
function sunIco(x, y, r){ var s = '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="var(--sunc)"/>'; for(var k=0;k<8;k++){ var t = k*Math.PI/4; s += '<line x1="' + (x + Math.cos(t)*(r + 2)).toFixed(1) + '" y1="' + (y + Math.sin(t)*(r + 2)).toFixed(1) + '" x2="' + (x + Math.cos(t)*(r + 4.5)).toFixed(1) + '" y2="' + (y + Math.sin(t)*(r + 4.5)).toFixed(1) + '" stroke="var(--sunc)" stroke-width="1.6" stroke-linecap="round"/>'; } return s; }
function moonIco(x, y, r){ return '<path d="M' + (x + r*0.35) + ' ' + (y - r) + 'A' + r + ' ' + r + ' 0 1 0 ' + (x + r) + ' ' + (y + r*0.35) + 'A' + (r*0.8) + ' ' + (r*0.8) + ' 0 0 1 ' + (x + r*0.35) + ' ' + (y - r) + 'Z" fill="var(--bodyn)"/>'; }
/* 24-hour dial on the local clock, noon at the top: today's daylight round the rim, your usual night here (dashed),
   and the body's night now (outer blue ring) and on the three days before (inner rings, fading). */
function dialSVG(C, nw, Pl){
  var cx = 70, cy = 70, x = C.at(nw), bed = hhmmH(S.bed), wake = hhmmH(S.wake), loc = Pl.E.locAt(nw);
  function pt(h, r){ var t = (h - 12)/24*2*Math.PI; return [(cx + r*Math.sin(t)).toFixed(1), (cy - r*Math.cos(t)).toFixed(1)]; }
  function arc(h0, h1, r){
    var span = ((h1 - h0) % 24 + 24) % 24; if(span < 0.05) return '';
    var p0 = pt(h0, r), p1 = pt(h0 + span, r);
    return 'M' + p0[0] + ' ' + p0[1] + 'A' + r + ' ' + r + ' 0 ' + (span > 12 ? 1 : 0) + ' 1 ' + p1[0] + ' ' + p1[1];
  }
  var s = '<svg class="dial" viewBox="-8 -8 156 156" role="img" aria-label="Body clock dial, noon at the top">';
  /* daylight rim for today where you are */
  var mid = BC.localToMs(loc.tz, BC.dateStr(loc.tz, nw) + 'T00:00');
  for(var i=0;i<48;i++){
    var t = mid + (i + 0.5)*0.5*H, e = BC.sunElev(t, loc.lat, loc.lon);
    s += '<path d="' + arc(i*0.5, i*0.5 + 0.5, 58) + '" fill="none" stroke="' + (e > 2 ? 'var(--day)' : e < -6 ? 'var(--nite)' : 'var(--dusk)') + '" stroke-width="7"/>';
  }
  s += sunIco(70, -1, 4) + moonIco(70, 141, 5.5);
  var l6 = pt(6, 70), l18 = pt(18, 70);
  s += '<text x="' + l6[0] + '" y="' + (+l6[1] + 3.5) + '" font-size="10" text-anchor="middle" fill="var(--sec)">06</text><text x="' + l18[0] + '" y="' + (+l18[1] + 3.5) + '" font-size="10" text-anchor="middle" fill="var(--sec)">18</text>';
  s += '<path d="' + arc(bed, wake, 49) + '" fill="none" stroke="var(--sec)" stroke-width="1.5" stroke-dasharray="2 3" stroke-linecap="round"/>';
  for(var k=3;k>=0;k--){
    var tk = nw - k*24*H;
    if(tk < C.R.t0) continue;

  }
  var hNow = ((nw/H + x.off) % 24 + 24) % 24, e2 = pt(hNow, 58);

  return s + '</svg>';
}
function clockCard(Pl, nw){

  if(nw < Pl.E.t0 || nw > end) return '';

  var bed = hhmmH(S.bed), wake = hhmmH(S.wake);
  var big = Math.abs(x.gap) < 0.25 ? 'In step' : gapTxt(x.gap) + (x.gap > 0 ? ' behind' : ' ahead');
  var sub = Math.abs(x.gap) < 0.25 ? 'Your body is on ' + esc(city) + ' time.' : 'Your body thinks it’s ' + hh(x.bodyH) + '. Its night is ' + hh(bed + x.gap) + '–' + hh(wake + x.gap) + ' here.';
  var foot = '';

  return '<button class="card" type="button" data-go="chart/clock" style="border:0;text-align:left;width:100%;cursor:pointer;padding:14px 16px">' +
    '<div class="dialrow">' + dialSVG(C, nw, Pl) + '<div style="flex:1;min-width:0"><div class="eyebrow">Body clock</div><div style="font-size:22px;font-weight:600;line-height:27px">' + esc(big) + '</div>' +
    '<div class="lab" style="margin-top:4px">' + sub + '</div>' + (foot ? '<div class="lab" style="margin-top:6px">' + foot + '</div>' : '') + '</div>' + I.chev + '</div>' +

/* ---------- views ---------- */
var V = {view:'now', arg:null, layPick:{}, showNum:{}, chartView:'land', chartMetric:'alert', destEdit:false, flight:null, flash:''};

function openSleep(id, preset){

  var Lb = Pl.E.locAt(a); if(!Lb.fl && Lb.tz) tz = Lb.tz;
  V.sleep = {id:x ? x.id : null, tz:tz, bed:BC.msToLocal(tz, a), wake:b == null ? '' : BC.msToLocal(tz, b), kind:x ? x.kind : preset ? (preset.kind === 'nap' ? 'nap' : 'main') : '', open:x && x.b == null, preset:preset || null};

function nextActualId(){ var m = 0; S.actual.forEach(function(a){ if(a.id > m) m = a.id; }); return m + 1; }
function saveSleep(){
  var sl = V.sleep, a = BC.localToMs(sl.tz, sl.bed), b = sl.wake ? BC.localToMs(sl.tz, sl.wake) : null;
  if(isNaN(a)){ V.sleepErr = 'Enter when you fell asleep.'; renderSleep(); return; }
  if(b == null && !sl.open){ V.sleepErr = 'Enter when you woke up.'; renderSleep(); return; }
  if(b != null && !(b > a)){ V.sleepErr = 'Waking up must be after falling asleep.'; renderSleep(); return; }
  if(b != null && b - a > 16*H){ V.sleepErr = 'That is over 16 hours. Check the dates.'; renderSleep(); return; }
  if(a > now() + 5*60000){ V.sleepErr = 'That is in the future. Log sleeps after you take them.'; renderSleep(); return; }
  var kind = sl.kind || ((b || now()) - a >= 4*H ? 'main' : 'nap');
  var rec = {id:sl.id || nextActualId(), a:a, b:b, kind:kind};
  S.actual = S.actual.filter(function(x){ return x.id !== rec.id; });
  /* a logged sleep replaces any skip it overlaps */
  S.skips = S.skips.filter(function(x){ return !(x.a < (b || now()) && a < x.b); });
  S.actual.push(rec); S.actual.sort(function(p,q){ return p.a - q.a; });

}

/* ---------- classic import, backup ---------- */
function classicData(){
  try{ var o = JSON.parse(localStorage.getItem(CLASSIC_KEY) || 'null'); return o && Array.isArray(o.rows) && o.rows.some(function(r){ return r.type === 'flight'; }) ? o : null; }catch(e){ return null; }
}
function importClassic(){
  var o = classicData(); if(!o) return 'Nothing to import.';
  function zoneOff(z){ return z === 'home' ? o.home : z === 'local' ? o.local : parseFloat(String(z).slice(2)) || 0; }
  function abs(t, z){ return BC.parseLocal(t) - zoneOff(z)*H; }
  var flights = [], skipped = [], id = 1;
  var sleepsIn = o.rows.filter(function(r){ return r.type === 'sleep' || r.type === 'plan'; }).map(function(r){ return [abs(r.s, r.sz), abs(r.e, r.ez)]; });
  o.rows.filter(function(r){ return r.type === 'flight'; }).forEach(function(r){
    var m = /([A-Z]{3})\W*(?:to|-|→|>)?\W*([A-Z]{3})/.exec((r.label || '').toUpperCase());
    var f = m && BC.airport(m[1]), t = m && BC.airport(m[2]);
    if(!f || !t){ skipped.push(r.label || 'Flight'); return; }
    var a = abs(r.s, r.sz), b = abs(r.e, r.ez);
    var rec = {id:id++, from:f.code, to:t.code, dep:BC.msToLocal(f.tz, a), arr:BC.msToLocal(t.tz, b), role:r.role || null, rest:+r.rest || 0};
    var inside = sleepsIn.filter(function(s){ return s[0] >= a && s[1] <= b; })[0];
    if(inside && (rec.role || (b - a >= 5*H ? 'operate' : 'commute')) === 'operate') rec.restUTC = {s:BC.isoUTC(inside[0]).slice(11), e:BC.isoUTC(inside[1]).slice(11)};
    flights.push(rec);
  });
  if(o.bed) S.bed = o.bed; if(o.wake) S.wake = o.wake; if(o.landBed != null) S.landBed = o.landBed; if(o.balance) S.balance = o.balance;
  S.flights = flights; S.lay = {}; S.actual = []; S.skips = []; save();
  return 'Imported ' + flights.length + ' flight' + (flights.length === 1 ? '' : 's') + '.' + (skipped.length ? ' Not imported, unknown airport: ' + skipped.join(', ') + '. Add those by hand.' : '');
}

async function backup(){
  var text = JSON.stringify({app:'body-clock', v:1, saved:new Date().toISOString(), state:S}, null, 1);
  var name = 'body-clock-trip-' + new Date().toISOString().slice(0,10) + '.json';
  try{
    var file = new File([text], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); V.flash = 'Backup shared. Choose Save to Files to keep it.'; render(); return; }
  }catch(err){ if(err && err.name === 'AbortError'){ return; } }
  var url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  V.flash = 'Backup saved as ' + name + '.'; render();
}
function restoreFile(file){
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var o = JSON.parse(rd.result), st = o && o.state ? o.state : o;
      if(st && st.v === 1 && Array.isArray(st.flights)){ S = fix(st); save(); V.flash = 'Trip restored.'; }
      else if(st && Array.isArray(st.rows)){ V.flash = 'That is a classic app backup. Restore it in the classic app, then use Import.'; }
      else V.flash = 'That file is not a Body Clock backup.';
    }catch(e){ V.flash = 'Could not read that file.'; }

}

/* ---------- update ---------- */
async function cleanReload(){
  try{ if(navigator.serviceWorker){ var reg = await navigator.serviceWorker.getRegistration(location.pathname); if(reg && reg.scope.indexOf('/classic/') < 0) await reg.unregister(); } }catch(e){}
  try{ if(window.caches){ var keys = await caches.keys(); await Promise.all(keys.filter(function(k){ return k.indexOf('bc2-' + (location.pathname.indexOf('/next/') >= 0 ? 'next-' : 'main-')) === 0; }).map(function(k){ return caches.delete(k); })); } }catch(e){}
  location.replace(location.pathname + '?u=' + Date.now());
}
async function checkUpdate(){
  if(V.updForce){
    if(navigator.onLine === false){ V.updMsg = 'You are offline. Clearing the saved copy now would leave the app unable to open, so it was left alone.'; render(); return; }
    V.updMsg = 'Reloading…'; render(); cleanReload(); return;
  }
  V.updMsg = 'Checking…'; render();
  try{
    var res = await fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'});
    var m = /var BUILD = '([^']*)'/.exec(await res.text());
    if(!res.ok || !m) throw new Error('bad');
    if(m[1] !== BUILD){ V.updMsg = 'Found ' + m[1] + '. Reloading…'; render(); cleanReload(); return; }
    V.updMsg = 'You have the newest build. Tap again to reload anyway.';
  }catch(e){ V.updMsg = 'Could not reach the server. Tap again to reload when you are online.'; }
  V.updForce = true; V.updLabel = 'Reload anyway'; render();
}

/* ---------- routing and render ---------- */
function go(path){
  var parts = String(path).split('/'), view = parts[0], arg = parts.slice(1).join('/') || null;
  if(view === 'flight'){ openFlight(arg); return; }
  if(view === 'sleepnew'){ openSleep(null); return; }
  if(view === 'calc'){ V.calc = null; V.calcArg = arg; }
  if(view === 'trip') V.scrollNow = true;
  if(view === 'rest' || view === 'lay' || view === 'chart') V.from = V.view;
  if(view === 'chart' && arg) V.chartMetric = arg;
  V.view = view; V.arg = arg; V.flash = ''; V.confirmClear = false; V.destMsg = '';
  if(view === 'lay') V.layPick[arg] = null;
  try{ history.replaceState(null, '', '#' + path); }catch(e){}
  render(); window.scrollTo(0, 0);
}
function render(){
  var app = $('#app'), h;
  try{
    if(V.view === 'trip') h = viewTrip();
    else if(V.view === 'lay') h = viewLay(V.arg);
    else if(V.view === 'chart') h = viewChart();
    else if(V.view === 'rest') h = viewRest(V.arg);
    else if(V.view === 'settings') h = viewSettings();
    else if(V.view === 'dest') h = viewDest();
    else if(V.view === 'calc') h = viewCalc();
    else { V.view = 'now'; h = viewNow(); }
  }catch(err){ h = '<p class="err">Something went wrong drawing this screen: ' + esc(err.message) + '</p>'; if(window.console) console.error(err); }
  app.innerHTML = '<div class="stack">' + h + '</div>';
  var tab = {now:'now', chart:'now', trip:'trip', lay:'trip', rest:V.from === 'now' ? 'now' : 'trip', settings:'settings', dest:'settings', calc:'calc'}[V.view];
  document.querySelectorAll('.tab').forEach(function(t){ if(t.dataset.go === tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  if(V.view === 'trip' && V.scrollNow){ V.scrollNow = false; var nl = document.querySelector('.nowline'); if(nl) setTimeout(function(){ nl.scrollIntoView({block:'center'}); }, 0); }
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var g = e.target.closest('[data-go]');
  if(g && !e.target.closest('[data-act]')){ e.preventDefault(); go(g.dataset.go); return; }
  var b = e.target.closest('[data-act]'); if(!b) return;
  var act = b.dataset.act, id = b.dataset.id;
  if(act === 'num'){ e.stopPropagation(); var sp = b.querySelector('span:last-child'); if(sp) sp.textContent = /·/.test(sp.textContent) ? sp.textContent.split(' · ')[0] : sp.textContent + ' · ' + b.dataset.num; return; }
  if(act === 'out'){
    var Pl = P(), L = layById(Pl, id), cfg = S.lay[id] || (S.lay[id] = {});
    var want = !L.out;
    cfg.out = (want === L.autoOut) ? null : want;
    if(cfg.out == null) delete cfg.out;
    cfg.choice = null; save(); render(); return;
  }
  if(act === 'pick'){ V.layPick[id] = b.dataset.opt; render(); return; }
  if(act === 'use'){
    var Pl2 = P(), L2 = layById(Pl2, id), pick = V.layPick[id] || L2.picked;
    var cfgU = S.lay[id] || (S.lay[id] = {}); cfgU.choice = pick; if(pick !== 'custom') delete cfgU.custom; save(); go('trip'); return;
  }
  if(act === 'cv'){ V.chartView = b.dataset.v; render(); return; }
  if(act === 'cm'){ V.chartMetric = b.dataset.v; try{ history.replaceState(null, '', '#chart/' + V.chartMetric); }catch(e2){} render(); return; }
  if(act === 'bedNow'){
    if(S.actual.some(function(x){ return x.b == null; })) return;
    var k = b.dataset.kind || (+BC.hm(placeTz(P(), now()), now()).slice(0,2) >= 18 || +BC.hm(placeTz(P(), now()), now()).slice(0,2) < 5 ? 'main' : 'nap');
    S.actual.push({id:nextActualId(), a:now(), b:null, kind:k}); save(); render(); window.scrollTo(0, 0); return;
  }
  if(act === 'up'){
    var op = S.actual.filter(function(x){ return x.b == null; })[0]; if(!op) return;
    if(now() - op.a < 10*60000) S.actual = S.actual.filter(function(x){ return x !== op; }); else op.b = now();
    save(); render(); return;
  }
  if(act === 'yes' || act === 'no' || act === 'diff'){
    var pb = pendingBlock(P()); if(!pb) return;
    if(act === 'yes'){ S.actual.push({id:nextActualId(), a:pb.a, b:pb.b, kind:pb.kind === 'nap' ? 'nap' : 'main'}); save(); render(); }
    else if(act === 'no'){ S.skips.push({a:pb.a, b:pb.b, kind:pb.kind === 'nap' ? 'nap' : 'main'}); save(); render(); }
    else openSleep(null, pb);
    return;
  }
  if(act === 'logSleep'){ openSleep(null); return; }
  if(act === 'addMenu'){
    $('#sheet').innerHTML = '<div class="sheet" data-act="menuBg"><div class="sheet-in" role="dialog" aria-modal="true" aria-label="Add"><div class="grab"><span></span></div><div class="stack" style="gap:10px;margin-top:14px">' +
      '<button class="btn" type="button" data-act="menuFlight">Add a flight</button><button class="btn sec" type="button" data-act="menuSleep">Log a sleep you took</button><button class="btn sec" type="button" data-act="menuBg2">Cancel</button></div></div></div>';
    return;
  }
  if(act === 'menuBg' && e.target === b || act === 'menuBg2'){ $('#sheet').innerHTML = ''; return; }
  if(act === 'menuFlight'){ $('#sheet').innerHTML = ''; openFlight('new'); return; }
  if(act === 'menuSleep'){ $('#sheet').innerHTML = ''; openSleep(null); return; }
  if(act === 'cScope'){ V.calc.scope = b.dataset.v; render(); return; }
  if(act === 'cGoal'){ V.calcGoal = b.dataset.v; render(); return; }
  if(act === 'cAuto'){ var fk = b.dataset.v === 'cBed' ? 'bedAuto' : 'wakeAuto'; V.calc[fk] = !V.calc[fk]; render(); return; }
  if(act === 'cUse' || act === 'cLog'){
    var c2 = V.calc, cr2 = V.calcRes; if(!cr2 || !cr2.w) return;
    var a2 = cr2.w.a, b2 = cr2.w.b; c2.kind = cr2.w.kind;
    if(act === 'cLog'){
      var openNow = b2 > now();
      S.actual = S.actual.filter(function(x){ return !(x.a < b2 && a2 < (x.b || now())); });
      S.actual.push({id:nextActualId(), a:a2, b:openNow ? null : b2, kind:c2.kind}); S.actual.sort(function(p,q){ return p.a - q.a; });
      save(); go('now'); return;
    }
    var r2 = cr2.r, Lc = r2.ctx.L;
    if(!Lc) return;
    var cfg2 = S.lay[Lc.id] || (S.lay[Lc.id] = {}), nw2 = now();
    var follow = cr2.then || (r2.rest ? r2.rest.blocks : []);
    var before = r2.Pl.sleeps.filter(function(x){ return x.lay === Lc.id && !x.actual && !x.open && x.a >= nw2 && x.b <= a2; });
    cfg2.custom = before.concat([{a:a2, b:b2, kind:c2.kind}], follow).map(function(x){ return {a:x.a, b:x.b, kind:x.kind === 'nap' ? 'nap' : 'main'}; });
    cfg2.choice = 'custom'; save(); go('now'); return;
  }
  if(act === 'editSleep'){ openSleep(id); return; }
  if(act === 'unskip'){ S.skips = S.skips.filter(function(x){ return String(x.a) !== String(id); }); save(); render(); return; }
  if(act === 'sleepBg' && e.target === b){ V.sleep = null; renderSleep(); return; }
  if(act === 'sleepCancel'){ V.sleep = null; V.confirmDel = false; renderSleep(); return; }
  if(act === 'sleepSave'){ saveSleep(); return; }
  if(act === 'slKind'){ V.sleep.kind = b.dataset.v; renderSleep(); return; }
  if(act === 'sleepDel'){
    if(!V.confirmDel){ V.confirmDel = true; renderSleep(); return; }
    S.actual = S.actual.filter(function(x){ return x.id !== V.sleep.id; }); save(); V.sleep = null; V.confirmDel = false; renderSleep(); render(); return;
  }
  if(act === 'rest' || act === 'clearRest'){
    var raw = S.flights.filter(function(x){ return String(x.id) === String(id); })[0]; if(!raw) return;
    if(act === 'rest') raw.rest = Math.max(0, Math.min(8, (+raw.rest || 0) + parseFloat(b.dataset.d)));
    else delete raw.restUTC;
    save(); render(); return;
  }
  if(act === 'nightAuto'){ S.night.auto = !(S.night.auto !== false); save(); render(); return; }
  if(act === 'backup'){ backup(); return; }
  if(act === 'restore'){ $('#impFile').click(); return; }
  if(act === 'import'){ V.flash = importClassic(); if(V.view === 'now'){ render(); } else render(); return; }
  if(act === 'example'){ exampleTrip(); V.flash = 'Example trip loaded: Atlanta, Dallas, São Paulo and back.'; render(); return; }
  if(act === 'clear'){ if(!V.confirmClear){ V.confirmClear = true; render(); setTimeout(function(){ if(V.confirmClear){ V.confirmClear = false; render(); } }, 3500); return; } S.flights = []; S.lay = {}; S.actual = []; S.skips = []; save(); V.confirmClear = false; V.flash = 'All flights removed.'; render(); return; }
  if(act === 'update'){ checkUpdate(); return; }
  if(act === 'destEdit'){ V.destEdit = !V.destEdit; render(); return; }
  if(act === 'destRm'){ S.dests = S.dests.filter(function(c){ return c !== b.dataset.code; }); save(); render(); return; }
  if(act === 'destReset'){ S.dests = DEFAULT_DESTS.slice(); save(); render(); return; }
  if(act === 'destAdd'){
    var c = ($('#dAdd').value || '').trim().toUpperCase();
    if(!AIRPORTS[c]){ V.destMsg = c ? c + ' is not in the built-in list yet. Tell Claude and it can be added.' : 'Type a three-letter code.'; render(); return; }
    if(S.dests.indexOf(c) < 0) S.dests.push(c);
    V.destMsg = ''; save(); render(); return;
  }
  /* flight sheet */
  if(act === 'sheetBg' && e.target === b){ V.flight = null; renderSheet(); return; }
  if(act === 'sheetCancel'){ V.flight = null; V.confirmDel = false; renderSheet(); return; }
  if(act === 'sheetSave'){ saveFlight(); return; }
  if(act === 'toChip'){ V.flight.to = b.dataset.code; autoArr(); renderSheet(); return; }
  if(act === 'role'){ V.flight.role = b.dataset.v; renderSheet(); return; }
  if(act === 'frest'){ V.flight.rest = Math.max(0, Math.min(8, (+V.flight.rest || 0) + parseFloat(b.dataset.d))); renderSheet(); return; }
  if(act === 'sheetDel'){
    if(!V.confirmDel){ V.confirmDel = true; renderSheet(); return; }
    S.flights = S.flights.filter(function(x){ return x.id !== V.flight.id; }); save(); V.flight = null; V.confirmDel = false; renderSheet(); render(); return;
  }
});
function autoArr(){
  var fl = V.flight, d = flightDerived(fl);
  if(fl.arr || !d.f || !d.t || isNaN(d.a)) return;
  fl.arr = BC.msToLocal(d.t.tz, d.a + 8*H);
}
document.addEventListener('change', function(e){
  var t = e.target, id = t.id;
  if(V.calc && (id === 'cBed' || id === 'cWake')){
    if(t.value){
      if(id === 'cBed'){ V.calc.bed = t.value; V.calc.bedAuto = false; }
      else { V.calc.wake = t.value; V.calc.wakeAuto = false; }
    }
    render(); return;
  }
  if(V.calc && id === 'cFlight'){ V.calc.fid = t.value; render(); return; }
  if(V.sleep && (id === 'slBed' || id === 'slWake')){ V.sleep[id === 'slBed' ? 'bed' : 'wake'] = t.value; return; }
  if(id === 'loNs' || id === 'loNe'){
    var cfgL = S.lay[t.dataset.id] || (S.lay[t.dataset.id] = {});
    if(t.value) cfgL[id === 'loNs' ? 'ns' : 'ne'] = t.value;
    save(); render(); return;
  }
  if(V.flight && (id === 'fDep' || id === 'fArr')){ V.flight[id === 'fDep' ? 'dep' : 'arr'] = t.value; if(id === 'fDep') autoArr(); renderSheet(); return; }
  var map = {sHome:'home', sBed:'bed', sWake:'wake', sBal:'balance'};
  if(map[id]){ if(t.value) S[map[id]] = t.value; save(); render(); return; }
  var nums = {sLand:['landBed',0,6], sVan:['van',0.5,4]};
  if(nums[id]){ var v = parseFloat(t.value); if(!isNaN(v)){ S[nums[id][0]] = Math.max(nums[id][1], Math.min(nums[id][2], v)); save(); render(); } return; }
  if(id === 'sReady'){ var r = parseFloat(t.value); if(!isNaN(r)){ S.ready = Math.max(0, Math.min(180, r))/60; save(); render(); } return; }
  var nn = {sNs:'start', sNe:'end'};
  if(nn[id]){ if(t.value){ S.night[nn[id]] = t.value; save(); render(); } return; }
  if(id === 'sGap' || id === 'sLast'){ var g = parseFloat(t.value); if(!isNaN(g)){ S.night[id === 'sGap' ? 'gap' : 'last'] = Math.max(8, Math.min(24, g)); save(); render(); } return; }
  if(id === 'rs' || id === 're'){
    var raw = S.flights.filter(function(x){ return String(x.id) === String(V.arg); })[0]; if(!raw) return;
    var s = $('#rs').value, en = $('#re').value;
    if(s || en) raw.restUTC = {s:s, e:en}; else delete raw.restUTC;
    save(); render(); return;
  }
  if(id === 'impFile'){ var f = t.files && t.files[0]; if(f) restoreFile(f); t.value = ''; }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if(V.flight && (t.id === 'fFrom' || t.id === 'fTo')){
    var v = t.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3);
    V.flight[t.id === 'fFrom' ? 'from' : 'to'] = v;
    if(v.length === 3){ autoArr(); var pos = t.id; renderSheet(); var el = $('#' + pos); if(el){ el.focus(); el.setSelectionRange(3, 3); } }
  }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && V.flight){ V.flight = null; renderSheet(); }
  if(e.key === 'Escape' && V.sleep){ V.sleep = null; renderSleep(); }
  if(e.key === 'Enter' && e.target.id === 'dAdd'){ var btn = document.querySelector('[data-act=destAdd]'); if(btn) btn.click(); }
});

/* keep the Now screen current */
setInterval(function(){ if(!document.hidden && !V.flight && !V.sleep && (V.view === 'now' || V.view === 'chart')) render(); }, 60000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden && !V.flight && !V.sleep) render(); });

window.addEventListener('hashchange', function(){ var hsh = decodeURIComponent((location.hash || '').replace(/^#/, '')); if(hsh && hsh !== V.view + (V.arg ? '/' + V.arg : '')) go(hsh); });
var start = decodeURIComponent((location.hash || '').replace(/^#/, ''));
if(start && !/^flight/.test(start)) go(start); else render();
})();
