<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crew Rest</title>
<meta name="description" content="Splits the crew rest window into equal rests and gives start, end and wake-up times in UTC.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --sec:#5F5F66; --ter:#8A8A90; --sep:rgba(60,60,67,.18);
  --fill:rgba(118,118,128,.12); --tint:#0A66D8; --danger:#C4161C;
  --c1:#5856D6; --c2:#0A84A8; --c3:#C2378A; --c4:#B7791F; --flight:#1C1C1E;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --sec:#A1A1A8; --ter:#7C7C82; --sep:rgba(84,84,88,.6);
    --fill:rgba(118,118,128,.24); --tint:#3E9BFF; --danger:#FF6961;
    --c1:#8D8BFF; --c2:#4CC3E6; --c3:#F06BB8; --c4:#E0A84A; --flight:#E5E5EA;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.3}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 40px)}
a{color:var(--tint);text-decoration:none}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;font-size:17px}
h1{margin:0 4px;font-size:22px;line-height:28px;font-weight:700;text-align:center}
.foot{margin:14px 4px 0;font-size:13px;line-height:18px;color:var(--sec)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./#settings">‹ Body Clock</a>
  <h1>Crew rest</h1>
  <div class="cr-cap">Two pilots always at the controls</div>
  <div id="app" aria-live="polite"></div>
  <p class="foot">Check the plan against your company’s rules and the captain’s plan. Your inputs stay on this device.</p>
</div>
<script src="airports.js"></script>
<script src="engine.js"></script>
<script src="crew-ui.js"></script>
<script>
(function(){
  'use strict';
  var MIN = 60000, H = 3600000, KEY = 'bc-crewrest2';
  var D = {crew:3, off:'', on:'', start:10, startSet:'', end:30, wake:10, round:1, gap:0, each:1};
  var st = {}; Object.keys(D).forEach(function(k){ st[k] = D[k]; });
  try{ var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if(sv && typeof sv === 'object') Object.keys(D).forEach(function(k){ if(sv[k] !== undefined) st[k] = sv[k]; }); }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  /* a UTC HH:MM as the moment nearest to ref */
  function near(hhmm, ref){
    var d = new Date(ref), p = hhmm.split(':');
    var t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), +p[0], +p[1]);
    while(t < ref - 12*H) t += 24*H;
    while(t > ref + 12*H) t -= 24*H;
    return t;
  }
  function times(){
    if(!st.off || !st.on) return null;
    var off = near(st.off, Date.now()), on = near(st.on, off);
    while(on <= off) on += 24*H;
    var auto = off + st.start*MIN, start = auto;
    if(st.startSet){ start = near(st.startSet, auto); }
    return {off:off, on:on, auto:auto, start:start};
  }
  function render(){
    var T = times(), cp = null;
    if(T) cp = BC.crewBreaks(T.off, T.on, st.crew, st.each, T.start, {end:st.end, wake:st.wake, round:st.round, gap:st.gap});
    if(cp && !cp.err && T.start < T.off) cp = {err:'Rest begins before takeoff.'};
    var h = CRUI.clockHTML() + CRUI.settingsHTML({crew:st.crew, slot:null, off:st.off, on:st.on, offSub:'', onSub:'',
                 start:st.start, startSet:st.startSet, autoStart:T ? T.auto : null, end:st.end, wake:st.wake, round:st.round, gap:st.gap, each:st.each});
    h += T ? CRUI.resultsHTML(cp, {each:st.each}) : '<p class="cr-hint" style="margin-top:18px">Type takeoff and landing in UTC (for example 0130) to see the plan.</p>';
    document.getElementById('app').innerHTML = h;
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-cr]'); if(!b) return;
    var k = b.dataset.cr;
    if(k === 'crew') st.crew = +b.dataset.v;
    else if(k === 'each') st.each = +b.dataset.v;
    else if(k === 'round') st.round = st.round === 5 ? 1 : 5;
    else if(k === 'gap') st.gap = st.gap ? 0 : 10;
    else if(k === 'wake') st.wake = Math.max(0, Math.min(30, st.wake + (+b.dataset.d)));
    else if(k === 'startNow'){ var n = Math.ceil((Date.now() + MIN)/MIN)*MIN; st.startSet = CRUI.z4(n).slice(0, 2) + ':' + CRUI.z4(n).slice(2); }
    else if(k === 'startClear') st.startSet = '';
    save(); render();
  });
  document.addEventListener('change', function(e){
    var el = e.target, v = el.value;
    if(el.id === 'cr-off' || el.id === 'cr-on'){ var t = CRUI.parseHHMM(v); st[el.id === 'cr-off' ? 'off' : 'on'] = t || ''; }
    else if(el.id === 'cr-start'){
      /* a number of minutes, or a time (4 digits) */
      var d = v.replace(/\D/g, '');
      if(d.length >= 3){ var t2 = CRUI.parseHHMM(d); if(t2) st.startSet = t2; }
      else if(d !== '') st.start = Math.min(120, +d);
    }
    else if(el.id === 'cr-end'){ var d2 = v.replace(/\D/g, ''); if(d2 !== '') st.end = Math.min(180, +d2); }
    else return;
    save(); render();
  });
  /* the Enter key on the number pad moves on */
  document.addEventListener('keydown', function(e){ if(e.key === 'Enter' && e.target.id && e.target.id.indexOf('cr-') === 0){ e.target.blur(); } });
  CRUI.injectCSS(); render(); CRUI.startClock();
})();
</script>
</body>
</html>
